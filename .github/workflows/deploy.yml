name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A project repo is served from https://hacu9.github.io/portfolio/, so the
      # build needs that subpath baked into every asset and link.
      #
      # If you rename the repo to hacu9.github.io (a user site served from the
      # root), set this to "/" instead. Nothing else changes.
      SITE_BASE: /portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # Astro requires Node >=22.12; the action still defaults to 20.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
